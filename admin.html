
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <!-- GOOGLE FONT -->

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- FONT AWESOME -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  background:#0d0d0d;

  display:flex;

  min-height:100vh;

  overflow:hidden;
}

/* SIDEBAR */

.sidebar{

  width:250px;

  background:#111;

  border-right:1px solid rgba(212,175,55,0.12);

  padding:20px;

  transition:0.3s;
}

.logo{
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-around;
  margin-bottom:30px;
}

.logo img{

  width:160px;
}

  .close-btn{
    display:none;
    font-size: 18px;


  color:#f5d76e;
}

/* MENU */

.menu{

  list-style:none;
}

.menu li{

  margin-bottom:10px;
}

.menu li a{

  display:flex;
  align-items:center;

  gap:12px;

  padding:14px;

  border-radius:12px;

  text-decoration:none;

  color:#d1d1d1;

  transition:0.3s;
}

.menu li a:hover,
.menu li.active a{

  background:
  rgba(212,175,55,0.15);

  color:#f5d76e;
}

/* MAIN */

.main{

  flex:1;

  overflow:auto;
}

/* TOPBAR */

.topbar{

  height:70px;

  background:#121212;

  border-bottom:
  1px solid rgba(255,255,255,0.05);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 24px;
}

.topbar-left{

  display:flex;
  align-items:center;
}

.topbar h2{

  color:white;

  font-size:22px;
}

/* HAMBURGER */

.menu-btn{

  display:none;

  color:#f5d76e;

  font-size:22px;

  cursor:pointer;

  margin-right:15px;
}

/* ADMIN INFO */

.admin-info{

  display:flex;
  align-items:center;

  gap:12px;
}

.avatar{

  width:45px;
  height:45px;

  border-radius:50%;

  background:
  linear-gradient(
  135deg,
  #c89b2d,
  #f5de87
  );

  display:flex;
  justify-content:center;
  align-items:center;

  color:black;

  font-weight:700;
}

.admin-info h4{

  color:white;

  font-size:14px;
}

.admin-info p{

  color:#bdbdbd;

  font-size:12px;
}

/* CONTENT */

.content{

  padding:22px;
}

/* CARDS */

.cards{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:18px;

  margin-bottom:24px;
}

.card{

  background:#151515;

  border-radius:18px;

  padding:20px;

  border:1px solid rgba(212,175,55,0.12);

  display:flex;
  align-items:center;

  gap:15px;
}

.card-icon{

  width:55px;
  height:55px;

  border-radius:15px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:20px;
}

.gold{
  background:rgba(212,175,55,0.15);
  color:#f5d76e;
}

.blue{
  background:rgba(59,130,246,0.15);
  color:#60a5fa;
}

.green{
  background:rgba(34,197,94,0.15);
  color:#4ade80;
}

.red{
  background:rgba(239,68,68,0.15);
  color:#f87171;
}

.card h2{

  color:white;

  margin-bottom:5px;
}

.card p{

  color:#bdbdbd;

  font-size:13px;
}

/* TABLE */

.table-box{

  background:#151515;

  border-radius:18px;

  padding:20px;

  border:1px solid rgba(212,175,55,0.12);
}

.table-header{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;
}

.table-header h2{

  color:white;
}

.table-header button{

  background:#d4af37;

  border:none;

  padding:10px 14px;

  border-radius:10px;

  font-weight:600;

  cursor:pointer;
}

table{

  width:100%;

  border-collapse:collapse;
}

table th{

  text-align:left;

  color:#f5d76e;

  padding:12px;

  font-size:13px;
}

table td{

  padding:12px;

  color:#d1d1d1;

  border-top:
  1px solid rgba(255,255,255,0.05);

  font-size:13px;
}

/* STATUS */

.status{

  padding:6px 12px;

  border-radius:20px;

  font-size:11px;

  font-weight:600;
}

.active{
  background:rgba(34,197,94,0.15);
  color:#4ade80;
}

.pending{
  background:rgba(245,158,11,0.15);
  color:#facc15;
}

.closed{
  background:rgba(239,68,68,0.15);
  color:#f87171;
}

/* MOBILE */

@media(max-width:768px){

  .menu-btn{
    display:block;
  }

  .close-btn{
    display:block;
}

  .sidebar{

    position:fixed;

    left:-260px;
    top:0;

    width:250px;
    height:100vh;

    z-index:999;

    background:#111;
  }

  .sidebar.showSidebar{

    left:0;
  }

  table{
    min-width:650px;
  }

  .table-box{
    overflow:auto;
  }

}

@media (max-width:500px) {
   .admin-info h4{
    display: none;
}

.admin-info p{
    display: none;
}


}



</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
  <img src="./src/logo.webp" alt="Logo">

  <a class="close-btn">
    <i class="fa-solid fa-xmark"></i>
  </a>
</div>

  <ul class="menu">

    <li class="active">
      <a href="#">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
      </a>
    </li>

    <li>
      <a href="#">
        <i class="fa-solid fa-users"></i>
        Clients
      </a>
    </li>

    <li>
      <a href="#">
        <i class="fa-solid fa-scale-balanced"></i>
        Cases
      </a>
    </li>

    <li>
      <a href="#">
        <i class="fa-solid fa-calendar-check"></i>
        Appointments
      </a>
    </li>

    <li>
      <a href="#">
        <i class="fa-solid fa-chart-pie"></i>
        Reports
      </a>
    </li>

    <li>
      <a href="#">
        <i class="fa-solid fa-gear"></i>
        Settings
      </a>
    </li>

    <li>
      <a href="#"
        id="logoutBtn">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

      </a>
    </li>

  </ul>

</div>

<!-- MAIN -->

<div class="main">

  <!-- TOPBAR -->

  <div class="topbar">

    <div class="topbar-left">

      <!-- HAMBURGER -->

      <div class="menu-btn"
        id="menuBtn">

        <i class="fa-solid fa-bars"></i>

      </div>

      <h2 id="pageTitle">
        Dashboard
      </h2>

    </div>

    <div class="admin-info">

      <div class="avatar"
        id="adminLetter">

        A

      </div>

      <div>

        <h4 id="adminEmail">

          admin@gmail.com

        </h4>

        <p>

          Administrator

        </p>

      </div>

    </div>

  </div>

  <!-- CONTENT -->

  <div class="content"
    id="content">

    <!-- DASHBOARD DEFAULT -->

    <div class="cards">

      <div class="card">

        <div class="card-icon gold">

          <i class="fa-solid fa-users"></i>

        </div>

        <div>

          <h2>1,245</h2>

          <p>Total Clients</p>

        </div>

      </div>

      <div class="card">

        <div class="card-icon blue">

          <i class="fa-solid fa-scale-balanced"></i>

        </div>

        <div>

          <h2>325</h2>

          <p>Active Cases</p>

        </div>

      </div>

      <div class="card">

        <div class="card-icon green">

          <i class="fa-solid fa-calendar-check"></i>

        </div>

        <div>

          <h2>86</h2>

          <p>Appointments</p>

        </div>

      </div>

      <div class="card">

        <div class="card-icon red">

          <i class="fa-solid fa-money-check-dollar"></i>

        </div>

        <div>

          <h2>$24,500</h2>

          <p>Total Revenue</p>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

// ======================
// GET EMAIL
// ======================

const savedEmail =
  localStorage.getItem("adminEmail");

if(savedEmail){

  document.getElementById("adminEmail")
    .innerText = savedEmail;

  document.getElementById("adminLetter")
    .innerText =
    savedEmail.charAt(0).toUpperCase();
}

// ======================
// LOGOUT
// ======================

document.getElementById("logoutBtn")
.addEventListener("click", () => {

  localStorage.removeItem("adminEmail");

  window.location.href =
    "index.html";

});

// ======================
// HAMBURGER MENU
// ======================

const menuBtn = document.querySelector("#menuBtn");

const closeBtn = document.querySelector(".close-btn");

const sidebar = document.querySelector(".sidebar");

menuBtn.addEventListener("click", () => {
  sidebar.classList.add("showSidebar");
});

closeBtn.addEventListener("click", () => {
  sidebar.classList.remove("showSidebar");
});

// ======================
// MENU CONTENT
// ======================

const menuItems =
  document.querySelectorAll(".menu li");

const content =
  document.getElementById("content");

const pageTitle =
  document.getElementById("pageTitle");

menuItems.forEach((item) => {

  item.addEventListener("click", () => {

    menuItems.forEach((li) => {

      li.classList.remove("active");

    });

    item.classList.add("active");

    const menuName =
      item.innerText.trim();

    pageTitle.innerText =
      menuName;

    // DASHBOARD

    if(menuName === "Dashboard"){

      content.innerHTML = `

      <div class="cards">

        <div class="card">

          <div class="card-icon gold">

            <i class="fa-solid fa-users"></i>

          </div>

          <div>

            <h2>1,245</h2>

            <p>Total Clients</p>

          </div>

        </div>

        <div class="card">

          <div class="card-icon blue">

            <i class="fa-solid fa-scale-balanced"></i>

          </div>

          <div>

            <h2>325</h2>

            <p>Active Cases</p>

          </div>

        </div>

      </div>

      `;
    }

    // CLIENTS

    else if(menuName === "Clients"){

      content.innerHTML = `

      <div class="table-box">

        <div class="table-header">

          <h2>Clients</h2>

          <button>Add Client</button>

        </div>

        <table>

          <thead>

            <tr>

              <th>Name</th>

              <th>Email</th>

              <th>Status</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td>John Smith</td>

              <td>john@gmail.com</td>

              <td>
                <span class="status active">
                  Active
                </span>
              </td>

            </tr>

          </tbody>

        </table>

      </div>

      `;
    }

    // CASES

    else if(menuName === "Cases"){

      content.innerHTML = `

      <div class="table-box">

        <div class="table-header">

          <h2>Case Details</h2>

        </div>

        <table>

          <thead>

            <tr>

              <th>Case ID</th>

              <th>Client</th>

              <th>Status</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td>#LAW102</td>

              <td>David</td>

              <td>
                <span class="status pending">
                  Pending
                </span>
              </td>

            </tr>

          </tbody>

        </table>

      </div>

      `;
    }

    // APPOINTMENTS

    else if(menuName === "Appointments"){

      content.innerHTML = `

      <div class="table-box">

        <div class="table-header">

          <h2>Appointments</h2>

        </div>

        <table>

          <thead>

            <tr>

              <th>Client</th>

              <th>Date</th>

              <th>Time</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td>James</td>

              <td>14 Jun 2026</td>

              <td>10:30 AM</td>

            </tr>

          </tbody>

        </table>

      </div>

      `;
    }

    // REPORTS

    else if(menuName === "Reports"){

      content.innerHTML = `

      <div class="cards">

        <div class="card">

          <div class="card-icon red">

            <i class="fa-solid fa-chart-pie"></i>

          </div>

          <div>

            <h2>Monthly</h2>

            <p>Revenue Report</p>

          </div>

        </div>

      </div>

      `;
    }

    // SETTINGS

    else if(menuName === "Settings"){

      content.innerHTML = `

      <div class="table-box">

        <div class="table-header">

          <h2>Settings</h2>

        </div>

        <p style="color:#d1d1d1;">
          Manage your account settings.
        </p>

      </div>

      `;
    }

  });

});

</script>

</body>

</html>
