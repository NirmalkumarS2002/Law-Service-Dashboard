<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Page Not Found</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
/* =========================
   GOOGLE FONT
========================= */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at top left, rgba(255,196,0,0.08), transparent 35%),
    radial-gradient(circle at bottom right, rgba(255,196,0,0.08), transparent 35%),
    #000;
  padding:20px;
  position:relative;
}

/* =========================
   FLOATING ICONS
========================= */
.floating-icon{
  position:absolute;
  color:rgba(255, 201, 59, 0.08);
  z-index:0;
  animation:float 6s ease-in-out infinite;
}

.icon1{
  top:10%;
  left:8%;
  font-size:60px;
}

.icon2{
  bottom:12%;
  right:10%;
  font-size:55px;
  animation-delay:2s;
}

.icon3{
  top:55%;
  left:15%;
  font-size:45px;
  animation-delay:1s;
}

@keyframes float{
  0%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-18px);
  }
  100%{
    transform:translateY(0px);
  }
}
/* =========================
   MAIN CONTAINER
========================= */
.container{
  width:100%;
  max-width:640px;
  background:rgba(10,10,10,0.95);
  border:1px solid rgba(255, 196, 0, 0.08);
  border-radius:32px;
  padding:55px 40px;
  text-align:center;
  position:relative;
  z-index:1;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03),
    0 25px 60px rgba(0,0,0,0.7),
    0 0 50px rgba(255,196,0,0.08);
  backdrop-filter:blur(14px);
}

/* top glow */
.container::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:32px;
  padding:1px;
  background:linear-gradient(
    135deg,
    rgba(255,196,0,0.3),
    transparent,
    rgba(255,196,0,0.15)
  );

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  -webkit-mask-composite:xor;
  mask-composite:exclude;

  pointer-events:none; /* IMPORTANT */
}

/* =========================
   LOGO
========================= */
.logo{
  width:210px;
  margin-bottom:25px;
  object-fit:contain;
}

/* =========================
   404 TEXT
========================= */
.error-code{
  font-size:8rem;
  line-height:1;
  font-weight:800;
  color:#f7c948;
  text-shadow:
    0 0 15px rgba(255, 201, 72, 0.4),
    0 0 40px rgba(255, 201, 72, 0.15);
  margin-bottom:12px;
}

.title{
  color:#fff;
  font-size:2.2rem;
  font-weight:700;
  margin-bottom:18px;
}

.description{
  color:#9d9d9d;
  font-size:1rem;
  line-height:1.9;
  max-width:500px;
  margin:0 auto 35px;
}

/* =========================
   BUTTONS
========================= */
.buttons{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-decoration:none;
  padding:15px 28px;
  border-radius:16px;
  font-size:1rem;
  font-weight:600;
  transition:0.35s ease;
  min-width:210px;
}
.btn i{
  font-size:0.95rem;
}

/* primary */
.btn-primary{
  background:#f7c948;
  color:#000;
  box-shadow:0 0 25px rgba(247,201,72,0.25);
}

.btn-primary:hover{
  transform:translateY(-4px);
  box-shadow:0 0 35px rgba(247,201,72,0.4);
}

/* secondary */
.btn-secondary{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;
}

.btn-secondary:hover{
  background:rgba(255,255,255,0.08);
  transform:translateY(-4px);
}

/* =========================
   TABLET
========================= */
@media (max-width:768px){

  .container{
    padding:45px 28px;
    border-radius:26px;
  }

  .logo{
    width:185px;
  }

  .error-code{
    font-size:6rem;
  }

  .title{
    font-size:1.9rem;
  }

  .description{
    font-size:0.95rem;
    line-height:1.8;
  }

  .btn{
    min-width:190px;
    padding:14px 24px;
  }

  .icon1{
    font-size:45px;
  }

  .icon2{
    font-size:42px;
  }

  .icon3{
    font-size:38px;
  }
}

/* =========================
   MOBILE
========================= */
@media (max-width:480px){

  body{
    padding:16px;
  }

  .container{
    padding:38px 22px;
    border-radius:22px;
  }

  .logo{
    width:155px;
    margin-bottom:18px;
  }

  .error-code{
    font-size:4.8rem;
  }

  .title{
    font-size:1.55rem;
    margin-bottom:14px;
  }

  .description{
    font-size:0.9rem;
    line-height:1.75;
    margin-bottom:28px;
  }

  .buttons{
    flex-direction:column;
    gap:14px;
  }

  .btn{
    width:100%;
    min-width:100%;
    padding:14px 20px;
    font-size:0.95rem;
  }

  .floating-icon{
    opacity:0.5;
  }

  .icon1{
    top:8%;
    left:4%;
    font-size:35px;
  }

  .icon2{
    bottom:8%;
    right:4%;
    font-size:34px;
  }

  .icon3{
    left:8%;
    top:65%;
    font-size:28px;
  }
}
  </style>
</head>

<body>

  <!-- Floating Icons -->
  <i class="fa-solid fa-scale-balanced floating-icon icon1"></i>
  <i class="fa-solid fa-gavel floating-icon icon2"></i>
  <i class="fa-solid fa-book floating-icon icon3"></i>

  <div class="container">

    <!-- Logo -->
    <img src="./src/logo.webp" alt="Logo" class="logo">

    <!-- 404 -->
    <h1 class="error-code">404</h1>

    <!-- Title -->
    <h2 class="title">Page Not Found</h2>

    <!-- Description -->
    <p class="description">
      The legal page you are trying to access may have been moved,
      removed, or temporarily unavailable. Please return to the dashboard
      or continue browsing our legal services.
    </p>
<div class="buttons">

  <button type="button" class="btn btn-primary" onclick="goDashboard()">
    <i class="fa-solid fa-house"></i>
    Back To Dashboard
  </button>

  <button type="button" class="btn btn-secondary" onclick="goBackPage()">
    <i class="fa-solid fa-arrow-left"></i>
    Go Back
  </button>

</div>

  </div>
<script>

function goDashboard() {
  window.location.href = "index.html";
}

function goBackPage() {
  history.back();
}

</script>
</body>
</html>
