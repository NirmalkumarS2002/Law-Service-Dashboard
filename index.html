<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <title>Law Service Login</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Poppins', sans-serif;

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:10px;

      overflow:auto;

      background:
      linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.88)
      ),
      url('./src/login-bg.webp');

      background-size:cover;
      background-position:center;

      position:relative;
    }

    body::before{

      content:"";

      position:absolute;

      width:100%;
      height:100%;

      backdrop-filter:blur(3px);
    }

    /* LOGIN CARD */

    .login-box{

      width:340px;

      padding:20px 30px;

      border-radius:20px;

      background:rgba(0,0,0,0.55);

      border:1px solid rgba(212,175,55,0.35);

      backdrop-filter:blur(12px);

      box-shadow:
      0 0 20px rgba(0,0,0,0.5),
      0 0 10px rgba(212,175,55,0.08);

      position:relative;
      z-index:10;
    }

    /* LOGO ICON */

    .logo-circle{

      width:58px;
      height:58px;

      border-radius:50%;

      margin:auto;

      background:
      linear-gradient(
        135deg,
        #c89b2d,
        #f5de87
      );

      display:flex;
      justify-content:center;
      align-items:center;

      margin-bottom:10px;

      box-shadow:
      0 0 20px rgba(212,175,55,0.18);
    }

    .logo-circle i{

      font-size:24px;

      color:#111;
    }

    /* COMPANY LOGO */

    .logowrap{

      display:flex;
      justify-content:center;

      margin-bottom:2px;
    }

    .companylogo{

      width:clamp(170px,19vw,210px);

      object-fit:contain;
    }

    /* LOGIN HERE TEXT */

    .login-here-text{

      text-align:center;

      color:white;

      font-size:18px;

      font-weight:600;

      margin-top:-2px;

      margin-bottom:12px;

      letter-spacing:1px;
    }

    /* LINE DESIGN */

    .line-design{

      display:flex;
      align-items:center;
      justify-content:center;

      gap:10px;

      margin-bottom:14px;
    }

    .line{

      width:65px;
      height:1px;

      background:#9b7a22;
    }

    .line-design i{

      color:#c89b2d;

      font-size:10px;
    }

    /* SUBTITLE */

    .subtitle{

      text-align:center;

      color:#d3d3d3;

      font-size:12px;

      margin-bottom:16px;

      line-height:1.5;
    }

    /* INPUT BOX */

    .input-box{

      margin-bottom:14px;
    }

    .input-box label{

      display:block;

      color:#e6c15a;

      margin-bottom:6px;

      font-size:13px;

      font-weight:600;
    }

    .input-field{

      position:relative;
    }

    /* LEFT ICON */

    .input-field i.left-icon{

      position:absolute;

      left:16px;
      top:50%;

      transform:translateY(-50%);

      color:#d4af37;

      font-size:14px;
    }

    /* INPUTS */

    .input-field input,
    .input-field select{

      width:100%;

      height:46px;

      border-radius:12px;

      border:1px solid rgba(212,175,55,0.35);

      background:rgba(0,0,0,0.35);

      color:white;

      font-size:13px;

      padding-left:45px;
      padding-right:40px;

      outline:none;

      transition:0.3s;
    }

    .input-field input::placeholder{

      color:#bdbdbd;
    }

    .input-field select option{

      color:black;
    }

    .input-field input:focus,
    .input-field select:focus{

      border-color:#f5d76e;

      box-shadow:
      0 0 10px rgba(212,175,55,0.1);
    }

    /* EYE BUTTON */

    .eye-btn{

      position:absolute;

      right:14px;
      top:50%;

      transform:translateY(-50%);

      color:#d4af37;

      cursor:pointer;

      font-size:14px;
    }

    /* LOGIN BUTTON */

    .login-btn{

      width:100%;

      height:46px;

      border:none;

      border-radius:12px;

      background:
      linear-gradient(
        135deg,
        #c89b2d,
        #f5de87
      );

      color:black;

      font-size:14px;

      font-weight:700;

      cursor:pointer;

      display:flex;
      justify-content:center;
      align-items:center;

      gap:8px;

      transition:0.3s;

      margin-top:2px;
    }

    .login-btn:hover{

      transform:translateY(-2px);

      box-shadow:
      0 8px 16px rgba(212,175,55,0.15);
    }

    /* BOTTOM LINE */

    .bottom-line{

      display:flex;
      align-items:center;
      justify-content:center;

      gap:8px;

      margin-top:14px;
      margin-bottom:10px;
    }

    .bottom-line .line{

      width:55px;
    }

    /* FOOTER */

    .footer-text{

      text-align:center;

      color:#bdbdbd;

      font-size:12px;
    }

    .footer-text a{

      color:#d4af37;

      text-decoration:none;

      font-weight:600;
    }

    /* MOBILE */

    @media(max-width:768px){

      .login-box{

        width:100%;

        max-width:320px;

        padding:12px 16px;
      }

      .companylogo{

        width:120px;
      }

      .login-here-text{

        font-size:14px;
      }

    }

  </style>
</head>

<body>

  <div class="login-box">

    <!-- LOGO ICON -->

    <div class="logo-circle">

      <i class="fa-solid fa-scale-balanced"></i>

    </div>

    <!-- COMPANY LOGO -->

    <div class="logowrap">

      <img src="./src/logo.webp"
        alt="company logo"
        class="companylogo">

    </div>

    <!-- LOGIN HERE -->

    <p class="login-here-text">

      Login Here

    </p>

    <!-- LINE -->

    <div class="line-design">

      <div class="line"></div>

      <i class="fa-solid fa-link"></i>

      <div class="line"></div>

    </div>

    <!-- SUBTITLE -->

    <p class="subtitle">

      Secure portal access for Admin and Client

    </p>

    <!-- ROLE -->

    <div class="input-box">

      <label>Select Role</label>

      <div class="input-field">

        <i class="fa-solid fa-user-shield left-icon"></i>

        <select>

          <option>Select Role</option>

          <option>Admin</option>

          <option>Client</option>

        </select>

      </div>

    </div>

    <!-- EMAIL -->

    <div class="input-box">

      <label>Email Address</label>

      <div class="input-field">

        <i class="fa-solid fa-envelope left-icon"></i>

      <input
  type="email"
  id="email"
  placeholder="Enter your email address">

      </div>

    </div>

    <!-- PASSWORD -->

    <div class="input-box">

      <label>Password</label>

      <div class="input-field">

        <i class="fa-solid fa-lock left-icon"></i>

        <input
          type="password"
          placeholder="Enter your password"
          id="password">

        <!-- EYE BUTTON -->

        <span
          class="eye-btn"
          id="togglePassword">

          <i class="fa-solid fa-eye"></i>

        </span>

      </div>

    </div>

    <!-- LOGIN BUTTON -->

    <button class="login-btn">

      <i class="fa-solid fa-scale-balanced"></i>

      Login Now

    </button>

    <!-- BOTTOM LINE -->

    <div class="bottom-line">

      <div class="line"></div>

      <i class="fa-solid fa-link"
        style="color:#c89b2d;font-size:10px;"></i>

      <div class="line"></div>

    </div>

    <!-- FOOTER -->

    <div class="footer-text">

      Forgot Password?

      <a href="sign.html">
        Sign Up
      </a>

    </div>

  </div>

<script>

  // GET FORM ELEMENTS

  const roleSelect =
    document.querySelector("select");

  const emailInput =
    document.querySelector('input[type="email"]');

  const passwordInput =
    document.getElementById("password");

  const loginBtn =
    document.querySelector(".login-btn");

  // LOGIN BUTTON CLICK

  loginBtn.addEventListener("click", (e) => {

    e.preventDefault();

    const role =
      roleSelect.value.trim();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value.trim();

    // ROLE VALIDATION

    if(role === "Select Role"){

      alert("Please select role");

      return;
    }

    // EMAIL VALIDATION

    if(email === ""){

      alert("Please enter email address");

      emailInput.focus();

      return;
    }

    const emailPattern =
      /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if(!email.match(emailPattern)){

      alert("Please enter valid email");

      emailInput.focus();

      return;
    }

    // PASSWORD VALIDATION

    if(password === ""){

      alert("Please enter password");

      passwordInput.focus();

      return;
    }

    if(password.length < 6){

      alert("Password must be minimum 6 characters");

      passwordInput.focus();

      return;
    }

    // ROLE BASED REDIRECT

   // ROLE BASED REDIRECT

if(role === "Admin"){

  // SAVE EMAIL

  localStorage.setItem(
    "adminEmail",
    email
  );

  window.location.href =
    "admin.html";
}

else if(role === "Client"){

  localStorage.setItem(
    "adminEmail",
    email
  );

  window.location.href =
    "client.html";
}

  });

  // PASSWORD SHOW / HIDE

  const togglePassword =
    document.getElementById("togglePassword");

  togglePassword.addEventListener("click", () => {

    const type =
      passwordInput.getAttribute("type") === "password"
      ? "text"
      : "password";

    passwordInput.setAttribute("type", type);

    togglePassword.innerHTML =
      type === "password"
      ? '<i class="fa-solid fa-eye"></i>'
      : '<i class="fa-solid fa-eye-slash"></i>';

  });

</script>

</body>

</html>
